<!doctype html>
<meta charset="utf-8">
<title>BrowserSkill looping video regression</title>
<style>
  body { margin: 40px; font: 18px system-ui; background: #f6f8fb; color: #203040; }
  main { max-width: 800px; }
  video { display: block; width: 420px; height: 236px; background: #172030; margin: 20px 0; }
  form, aside { padding: 20px; border: 1px solid #ccd6e0; margin: 16px 0; background: white; }
  button { font: inherit; padding: 12px 28px; }
  input { width: 300px; }
  .phase-a, .phase-b { color: #203040; }
</style>
<main>
  <h1>Looping preview</h1>
  <p>Local regression fixture. Space or the Pause button pauses the video.</p>
  <video id="preview" autoplay muted loop playsinline aria-label="Looping video preview"></video>
  <form id="controls" aria-label="Player controls">
    <button id="pause" type="button">Pause preview</button>
  </form>
  <aside id="dynamic" aria-label="Playback information"></aside>
</main>
<script>
  const query = new URLSearchParams(location.search);
  const variant = query.get('variant') || 'pixels';
  const interval = Number(query.get('interval') || 80);
  const video = document.querySelector('#preview');
  const dynamic = document.querySelector('#dynamic');
  const stats = { variant, keydowns: 0, clicks: 0, pauseCalls: 0, ticks: 0, presentedFrames: 0 };
  if (variant === 'text') dynamic.innerHTML = '<span id="clock">Playback tick 0</span>';
  if (['range', 'submitted-range', 'form-range', 'combined'].includes(variant)) dynamic.innerHTML = '<label>Playback progress <input id="progress" type="range" min="0" max="10000" value="0"></label>';
  if (variant === 'business-range') dynamic.innerHTML = '<label>Order amount <input id="progress" type="range" min="0" max="10000" value="0"></label>';
  if (variant === 'submitted-range') document.querySelector('#progress').name = 'order_amount';
  if (variant === 'form-range') {
    const form = document.createElement('form'); form.id = 'order-form'; dynamic.append(form); form.append(document.querySelector('#progress'));
  }
  if (variant === 'combined') dynamic.insertAdjacentHTML('beforeend', '<label>Order total <input id="order" value="100"></label>');
  if (variant === 'field' || variant === 'focus') dynamic.innerHTML = '<label>Order total <input id="order" value="100"></label>';
  if (variant === 'cosmetic') dynamic.innerHTML = '<span id="cosmetic" class="phase-a">Preview information</span>';
  if (variant === 'learned-price') dynamic.innerHTML = '<form aria-label="Purchase"><span id="price">Order total 100</span><button id="buy" type="button">Buy</button></form>';
  const pause = () => { stats.pauseCalls++; video.pause(); };
  document.querySelector('#pause').addEventListener('click', () => { stats.clicks++; pause(); });
  document.addEventListener('keydown', event => {
    if (event.code !== 'Space' && event.key !== ' ') return;
    event.preventDefault();
    stats.keydowns++;
    pause();
  });
  window.tickNoise = () => {
      if (video.paused) return;
      stats.ticks++;
      if (variant === 'text') document.querySelector('#clock').textContent = `Playback tick ${stats.ticks}`;
      if (document.querySelector('#progress')) document.querySelector('#progress').value = String(stats.ticks % 10000);
      if (variant === 'field' || variant === 'combined') document.querySelector('#order').value = String(100 + stats.ticks);
      if (variant === 'focus') document.querySelector('#order').focus();
      if (variant === 'cosmetic') document.querySelector('#cosmetic').className = stats.ticks % 2 ? 'phase-a' : 'phase-b';
      if (variant === 'learned-price') document.querySelector('#price').firstChild.nodeValue = `Order total ${100 + stats.ticks}`;
  };
  window.startNoise = () => {
    if (!window.noiseTimer) window.noiseTimer = setInterval(window.tickNoise, interval);
  };
  window.report = () => ({
    ...stats,
    ready: window.fixtureReady === true,
    decodedFrames: video.getVideoPlaybackQuality().totalVideoFrames,
    readyState: video.readyState,
    networkState: video.networkState,
    error: video.error?.message,
    visibility: document.visibilityState,
    paused: video.paused,
    loop: video.loop,
    currentTime: video.currentTime,
    duration: video.duration,
    focused: document.activeElement?.id || document.activeElement?.tagName,
    clock: document.querySelector('#clock')?.textContent,
    progress: document.querySelector('#progress')?.value,
    order: document.querySelector('#order')?.value,
    price: document.querySelector('#price')?.textContent,
  });
  (async () => {
    // A bundled synthetic WebM avoids depending on live MediaRecorder scheduling.
    video.src = '/preview.webm';
    const frame = () => { stats.presentedFrames++; video.requestVideoFrameCallback(frame); };
    video.requestVideoFrameCallback(frame);
    await video.play();
    window.fixtureReady = true;
  })().catch(error => { window.fixtureError = String(error.stack || error); });
</script>
