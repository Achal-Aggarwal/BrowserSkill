name: Update README contributors

on:
  schedule:
    - cron: "23 2 * * 1" # Monday 10:23 Asia/Shanghai.
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-readme-contributors
  cancel-in-progress: false

jobs:
  update:
    if: github.repository == 'Tencent/BrowserSkill'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
      pull-requests: write
    steps:
      # Execute trusted default-branch code even for a manual dispatch on another ref.
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: 22
      - name: Test the contributor updater
        run: node --test scripts/update-readme-contributors.test.mjs
      - name: Refresh contributor blocks
        id: refresh
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          node scripts/update-readme-contributors.mjs
          node scripts/update-readme-contributors.mjs --verify-only
          if git diff --quiet -- README.md README.zh-CN.md; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Contributor avatars are already up to date." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi
      - name: Create or update the maintenance pull request
        if: steps.refresh.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          BASE_BRANCH: ${{ github.event.repository.default_branch }}
          UPDATE_BRANCH: codex/update-readme-contributors
        run: |
          set -euo pipefail
          gh auth setup-git
          update_ref="refs/heads/$UPDATE_BRANCH"
          expected_sha="$(git ls-remote --heads origin "$update_ref" | cut -f1)"
          needs_push=true
          if [[ -n "$expected_sha" ]]; then
            git fetch --no-tags origin "$update_ref"
            merge_base="$(git merge-base HEAD FETCH_HEAD)"
            node scripts/update-readme-contributors.mjs --verify-only --base "$merge_base" --head FETCH_HEAD
            if git diff --quiet FETCH_HEAD -- README.md README.zh-CN.md; then
              needs_push=false
            fi
          fi
          if [[ "$needs_push" == true ]]; then
            git switch -C "$UPDATE_BRANCH"
            git config user.name 'github-actions[bot]'
            git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
            git add -- README.md README.zh-CN.md
            git commit -m 'docs: refresh README contributor avatars'
            git push --force-with-lease="$update_ref:$expected_sha" origin "HEAD:$update_ref"
          fi
          pr_url="$(gh pr list --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" --state open --json url --jq '.[0].url // empty')"
          if [[ -z "$pr_url" ]]; then
            body_file="$RUNNER_TEMP/readme-contributors-pr.md"
            cat > "$body_file" <<'BODY'
          Refresh both README contributor avatar blocks from GitHub's contributors API. Existing account order is preserved; new accounts are appended in stable ID order.

          Validation: updater tests passed, and the workflow verified that only the marked contributor blocks changed.

          This PR uses GITHUB_TOKEN. A maintainer may need to select **Approve workflows to run** on this PR before its required checks run. Normal review and branch protection still apply; this workflow does not approve or merge PRs.
          BODY
            if ! pr_url="$(gh pr create --repo "$GITHUB_REPOSITORY" --base "$BASE_BRANCH" --head "$UPDATE_BRANCH" --title 'docs: refresh README contributor avatars' --body-file "$body_file")"; then
              echo '::error::Could not create the contributor update PR. Check repository/org policy: Settings > Actions > General > Workflow permissions > Allow GitHub Actions to create and approve pull requests. This workflow only creates PRs; it never approves or merges. No PAT is required. Rerun after resolving the policy or reported API error; the maintenance branch is preserved.'
              exit 1
            fi
          fi
          echo "Contributor update PR: $pr_url" >> "$GITHUB_STEP_SUMMARY"
